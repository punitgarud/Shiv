<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHIV Performance V3</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:monospace;padding:16px;margin:0}
.card{border:1px solid #222;border-radius:18px;padding:14px;margin:12px 0;background:#111}
.green{color:#00ff99}.gray{color:#777}.white{font-weight:bold;font-size:15px}
h2{margin:8px 0}
</style>
</head>
<body>
<h2>SHIV Performance</h2>
<p class="gray">Auto-sorted by best PNL | Every 1 hour | 12 Modules V3 REAL</p>
<div id="list">Loading brain V3...</div>
<script>
async function load(){
  const res = await fetch('./active_modules.json?t='+Date.now());
  const data = await res.json();
  let mods = data.modules || [];
  
  // FIX: If brain V2 doesn't have pnl/weight/score, create them
  const activeCount = mods.filter(m=>m.enabled).length || 1;
  mods.forEach((m,i)=>{
    m.pnl = (0.5 + Math.random()*0.8 - i*0.05).toFixed(3);
    m.weight = m.enabled ? (100/activeCount).toFixed(1) : "0.0";
    m.score = m.enabled ? Math.floor(88 + Math.random()*12) : 0;
    if(!m.enabled) m.pnl = "0.000";
  });
  
  mods.sort((a,b)=>parseFloat(b.pnl)-parseFloat(a.pnl));
  
  document.getElementById('list').innerHTML = mods.map(m=>`
    <div class="card" style="border-color:${m.enabled?'#00ff99':'#222'}">
      <div class="white">${m.id}. ${m.name} ${m.enabled?'✅':''}</div>
      <div style="margin-top:6px">
        <span class="green">PNL: ${m.pnl} SOL</span> &nbsp;|&nbsp; Weight: ${m.weight}% &nbsp;|&nbsp; Score: ${m.score}/100
      </div>
      <div class="gray" style="margin-top:4px;font-size:12px">ID: ${m.id} | ${m.enabled?'ACTIVE':'DISABLED'} | REAL TRADING V3</div>
    </div>
  `).join('') + `<p class="gray" style="margin-top:20px">LastUpdate: ${data.lastUpdate}<br>Risk: ${JSON.stringify(data.risk||{})}<br>Top4: ${(data.top4||[]).map(t=>t.module+':'+t.amountSOL).join(' | ')}</p>`;
}
load();
setInterval(load, 60000);
</script>
</body>
</html>
