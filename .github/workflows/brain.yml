name: SHIV Brain
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node engine/index.js
      - run: |
          git config user.name "shiv-bot"
          git config user.email "bot@shiv.local"
          git add active_modules.json engine/modules/ || true
          git commit -m "brain: auto update $(date)" || echo "no changes"
          git push || echo "push done"