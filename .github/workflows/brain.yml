name: SHIV Brain
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node engine/index.js
      - run: |
          git config user.name "shiv-bot"
          git config user.email "bot@shiv.local"
          git add -f active_modules.json
          git commit -m "brain: update $(date -u)" || echo "no changes"
          git push